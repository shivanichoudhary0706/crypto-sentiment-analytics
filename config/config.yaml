coins:
  - symbol: "BTC/USDT"
    exchange: "binance"
  - symbol: "ETH/USDT"
    exchange: "binance"
  - symbol: "SOL/USDT"
    exchange: "binance"
  - symbol: "LTC/USDT"
    exchange: "binance"
  - symbol: "LINK/USDT"
    exchange: "binance"

kafka:
  bootstrap_servers: "localhost:9092"
  topics:
    market_raw: "raw-market-data"
    sentiment_raw: "raw-sentiment-data"
  consumer_group: "crypto-analytics-group"

sentiment_sources:
  news_rss:
    feeds:
      - name: "coindesk"
        url: "https://www.coindesk.com/arc/outboundfeeds/rss/"
      - name: "cointelegraph"
        url: "https://cointelegraph.com/rss"
      - name: "decrypt"
        url: "https://decrypt.co/feed"
      - name: "theblock"
        url: "https://www.theblock.co/rss.xml"
      - name: "cryptoslate"
        url: "https://cryptoslate.com/feed/"
    poll_interval_seconds: 300
  gdelt:
    query_terms:
      - "bitcoin"
      - "ethereum"
      - "cryptocurrency"
    poll_interval_seconds: 900
    max_records: 75

coin_keywords:
  "BTC/USDT": ["bitcoin", "btc"]
  "ETH/USDT": ["ethereum", "eth", "ether"]

sentiment_models:
  finbert_model_name: "ProsusAI/finbert"
  batch_size: 16

lag_detection:
  frequencies: ["1h", "4h"]
  max_lag: 24
  sentiment_column: finbert_compound
  fill_method: zero
  target: log_return
  significance: 0.05
  min_coverage_warn: 0.20
  output_dir: reports/lag
  rolling:
    enabled: true
    window_bars: 168
    step_bars: 24
    min_coverage: 0.20

event_study:
  cause_coins: ["BTC/USDT", "ETH/USDT"]
  price_targets: ["BTC/USDT", "ETH/USDT", "SOL/USDT", "LTC/USDT", "LINK/USDT"]
  sentiment_column: finbert_compound
  threshold: 0.6
  cluster_window_hours: 2.0
  horizon_hours: 48
  n_baseline_samples: 2000
  n_bootstrap: 1000
  min_events: 15
  significance: 0.05
  onset_min_run: 2
  min_effect_car: 0.01
  output_dir: reports/event_study

features:
  # Fills the features_bar table that signals, backtesting and the dashboard read.
  frequencies: ["1h", "4h"]
  rolling_short_bars: 6          # 6h at 1h bars, 24h at 4h bars
  rolling_long_bars: 24          # 24h at 1h bars, 4 days at 4h bars
  incremental_lookback_bars: 6   # bars re-computed on every incremental run
  table: features_bar
    # News attached to EVERY coin's bars (model inputs). key -> sentiment_scores.coin
  news_streams:
    btc: "BTC/USDT"
    eth: "ETH/USDT"
    mkt: "MARKET"

signal_model:
  # BUY / HOLD / SELL for the target coins, learned from past features_bar rows.
  targets: ["SOL/USDT", "LTC/USDT", "LINK/USDT"]   # coins we emit signals for
  input_coins: ["BTC/USDT", "ETH/USDT"]           # their price moves are model inputs
  freq: "1h"                 # model works on hourly bars
  horizon_bars: 1            # predict the next 1 bar (1 hour)
  buy_threshold: 0.55        # P(up) >= 0.55 -> BUY
  sell_threshold: 0.45       # P(up) <= 0.45 -> SELL, otherwise HOLD
  train_window_bars: 2160    # learn from the latest 90 days of hourly bars per coin
  min_train_bars: 500        # no signal for a coin with less labelled history
  table: signals
  model:                     # scikit-learn HistGradientBoostingClassifier
    max_iter: 200
    learning_rate: 0.05
    max_depth: 3
    min_samples_leaf: 50
    l2_regularization: 1.0
    random_state: 42
  backtest:                  # python -m signals.run_backtest
    test_days: 60            # replay the most recent 60 days
    retrain_every_bars: 24   # retrain once per simulated day
    fee_bps: 10              # 0.1% per buy or sell (Binance spot)
    output_dir: reports/backtest


signals:
  sentiment_positive_threshold: 0.6
  sentiment_negative_threshold: -0.6

logging:
  level: "INFO"
  log_dir: "logs"